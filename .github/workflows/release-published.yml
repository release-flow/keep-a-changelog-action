name: Release published

# Publishing a release (normally the draft made by release-pr-merged.yml) verifies the tag, moves the floating major
# tag (stable releases only) and stages the npm package. A maintainer must then publish the staged package on
# npmjs.com. See docs/DEVELOPMENT.md#releasing.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      commit: ${{ steps.check.outputs.commit }}
      major-ref: ${{ steps.check.outputs.major-ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Check the tag and release files
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$TAG" != v* ]]; then echo "::error::tag '$TAG' does not start with v"; exit 1; fi
          version="${TAG#v}"
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $TAG ($commit) is not on main"; exit 1
          fi
          node scripts/release.ts verify "$version" # also checks it is a valid release version
          prerelease=$(node scripts/release.ts is-prerelease "$version")
          if [[ "$prerelease" != "$RELEASE_PRERELEASE" ]]; then
            echo "::error::the release's prerelease flag ($RELEASE_PRERELEASE) does not match version $version"; exit 1
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "commit=$commit"
            echo "major-ref=v${version%%.*}"
          } >> "$GITHUB_OUTPUT"

  update-ref:
    name: Move the major tag
    needs: verify
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the major tag
    steps:
      # Keeps the checkout credentials: they push the tag.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - name: Update the major tag
        env:
          MAJOR_REF: ${{ needs.verify.outputs.major-ref }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -fa "$MAJOR_REF" -m "Update $MAJOR_REF tag" "$COMMIT"
          git push origin "refs/tags/$MAJOR_REF" --force
          echo "::notice::Updated ref $MAJOR_REF"

  publish-npm:
    name: Stage the npm package
    needs: [verify, update-ref]
    # Also runs for prereleases, when update-ref is skipped.
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.update-ref.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --legacy-peer-deps

      - run: npm run build && npm run package

      # package.json already has the release version: the verify job checked it.
      - name: Stage publish
        env:
          DIST_TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: npm stage publish --tag "$DIST_TAG" --provenance
